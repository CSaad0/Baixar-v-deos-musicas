name: Gerar APK e EXE

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Executável Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt pyinstaller

      - name: Baixar FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin

      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name BaixadorDeMusicas
          --add-binary "bin/ffmpeg.exe;."
          --add-binary "bin/ffprobe.exe;."
          --collect-submodules yt_dlp
          app.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/BaixadorDeMusicas.exe

  android:
    name: App Android (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renomear APKs
        run: |
          mkdir -p ../apk
          cd app/build/outputs/apk/release
          cp app-universal-release.apk   ../../../../../../apk/BaixadorDeMusicas-universal.apk
          cp app-arm64-v8a-release.apk   ../../../../../../apk/BaixadorDeMusicas-arm64.apk
          cp app-armeabi-v7a-release.apk ../../../../../../apk/BaixadorDeMusicas-arm32.apk
          cp app-x86_64-release.apk      ../../../../../../apk/BaixadorDeMusicas-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/*.apk

  release:
    name: Publicar na página de Releases
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Baixador de Músicas v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** baixe `BaixadorDeMusicas.exe` e dê dois cliques (não precisa instalar Python nem FFmpeg).

            **Android:** baixe `BaixadorDeMusicas-arm64.apk` (celulares atuais) ou `BaixadorDeMusicas-universal.apk` (funciona em qualquer um, mas é maior) e instale. Permita "instalar apps de fontes desconhecidas" quando o Android pedir.
          files: saida/*
